{% extends 'pedidos/base.html' %}
{% block content %}
<h3 class="fw-bold mb-3"><i class="bi bi-person-check me-2"></i>Pedidos por Confirmar (Mozo / Caja)</h3>
<div class="row g-3" id="contenedorMozo"></div>
{% endblock %}

{% block js %}
<script>
function cargarMozo() {
    fetch('/api/mozo/').then(r => r.json()).then(data => {
        let html = '';
        data.pedidos.forEach(p => {
            html += `
            <div class="col-12 col-md-4">
                <div class="card shadow-sm border-danger">
                    <div class="card-header bg-danger text-white d-flex justify-content-between font-monospace">
                        <strong>Mesa ${p.mesa}</strong> <span>${p.hora}</span>
                    </div>
                    <div class="card-body">
                        <ul class="list-unstyled mb-2">${p.detalles.map(d => `<li>• ${d}</li>`).join('')}</ul>
                        <div class="fw-bold mb-3 text-end text-success">Total: S/ ${p.total}</div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-success btn-sm w-100" onclick="procesar(${p.id}, 'pendiente')">Aprobar</button>
                            <button class="btn btn-outline-danger btn-sm w-100" onclick="procesar(${p.id}, 'cancelado')">Rechazar</button>
                        </div>
                    </div>
                </div>
            </div>`;
        });
        if(data.pedidos.length === 0) html = '<p class="text-muted">No hay pedidos pendientes de confirmación.</p>';
        document.getElementById('contenedorMozo').innerHTML = html;
    });
}

function procesar(id, estado) {
    fetch(`/api/pedido/estado/${id}/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nuevo_estado: estado })
    }).then(() => cargarMozo());
}

setInterval(cargarMozo, 3000);
cargarMozo();
</script>
{% endblock %}
