<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madam QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 90px; }
        .card-plato { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .cart-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; z-index: 1040; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark shadow-sm mb-3">
        <div class="container">
            <span class="navbar-brand fw-bold text-warning"><i class="bi bi-qr-code-scan me-2"></i>Madam QR</span>
            {% block nav %}{% endblock %}
        </div>
    </nav>
    <div class="container">{% block content %}{% endblock %}</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block js %}{% endblock %}
</body>
</html>
