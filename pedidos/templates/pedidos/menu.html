{% block js %}
<script>
let carrito = {};

function agregar(id, nombre, precio) {
    if (carrito[id]) carrito[id].cant += 1;
    else carrito[id] = { id, nombre, precio, cant: 1 };
    render();
}

function render() {
    let count = 0, total = 0;
    Object.values(carrito).forEach(i => { count += i.cant; total += i.cant * i.precio; });
    document.getElementById('cartCount').innerText = count;
    document.getElementById('cartTotal').innerText = total.toFixed(2);
    document.getElementById('cartBar').classList.toggle('d-none', count === 0);
}

function enviarPedido() {
    if (!navigator.geolocation) {
        alert("Tu navegador no soporta geolocalización.");
        return;
    }

    alert("Verificando tu ubicación...");

    navigator.geolocation.getCurrentPosition(
        (pos) => {
            let lat = pos.coords.latitude;
            let lon = pos.coords.longitude;
            let items = Object.values(carrito).map(i => ({ id: i.id, cantidad: i.cant }));

            fetch('/api/pedido/{{ mesa.token }}/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items, lat, lon })
            })
            .then(r => r.json())
            .then(res => {
                if (res.ok) {
                    alert('¡Pedido enviado! Esperando confirmación del mozo.');
                    carrito = {};
                    render();
                } else {
                    alert('Error: ' + res.error);
                }
            });
        },
        (err) => {
            alert("Debes activar y permitir el GPS para realizar un pedido.");
        },
        { enableHighAccuracy: true }
    );
}
</script>
{% endblock %}
